name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - staging

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-source:
    name: Backend Source Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validate Backend Helper Scripts
        run: |
          node --check backend/scripts/list-functions.mjs
          node --check backend/scripts/package-functions.mjs
          node --check backend/scripts/smoke-api.mjs
          node --check backend/eval/build-plaid-golden-enrich-fixture.mjs
          node --check backend/eval/capture-plaid-enrichment-predictions.mjs
          node --check backend/eval/generate-plaid-golden-candidates.mjs
          node --check backend/eval/pull-plaid-sandbox-transactions.mjs
          node --check backend/scripts/validate-openapi.mjs
          node --check backend/scripts/check-openapi-contract.mjs
          node --check backend/scripts/generate-api-docs.mjs
          node --check backend/scripts/generate-postman-collection.mjs
          node --check backend/scripts/check-route-coverage.mjs
          node --check backend/scripts/check-api-cors-readiness.mjs
          node --check backend/scripts/check-relative-imports.mjs
          node --check backend/scripts/package-monitors.mjs
          node --check backend/scripts/qa-enrichment-contract.mjs
          node --check backend/eval/qa-golden-enrichment.mjs
          node --check backend/eval/qa-model-output-report.mjs
          node --check backend/scripts/qa-partner-ingest.mjs
          node --check backend/scripts/qa-live-pipeline.mjs
          node --check backend/scripts/lib/qa-validators.mjs
          node --check infra/scripts/audit-live-db-rotation-preflight.mjs
          node --check infra/scripts/audit-live-secrets-cutover.mjs
          node --check infra/scripts/audit-live-secrets-rotation-kms.mjs
          node --check infra/scripts/audit-live-tracing-readiness.mjs
          node --check infra/scripts/check-db-rotation-preflight.mjs
          node --check infra/scripts/check-secrets-boundary.mjs
          node --check infra/scripts/check-secrets-rotation-kms-readiness.mjs
          node --check infra/scripts/check-tracing-readiness.mjs

      - name: Validate Monitor Entrypoints
        run: |
          find backend/monitors -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: List Recovered Functions
        run: npm run --prefix backend list:functions

      - name: Validate OpenAPI Draft
        run: npm run --prefix backend validate:openapi

      - name: Check OpenAPI Contract Completeness
        run: npm run --prefix backend check:openapi-contract

      - name: Generate API Docs And Postman Collection
        run: npm run --prefix backend docs:api

      - name: Check API Route Coverage
        run: npm run --prefix backend check:routes

      - name: Check API CORS Readiness
        run: npm run --prefix backend check:cors

      - name: Check Backend Relative Imports
        run: npm run --prefix backend check:imports

      - name: Check Enrichment QA Contracts
        run: npm run --prefix backend qa:enrichment

      - name: Check Golden Enrichment Expectations
        run: npm run --prefix backend qa:golden

      - name: Run Backend Contract Tests
        run: npm test --prefix backend

      - name: Check Model Gateway Readiness
        run: npm run --prefix backend check:model-gateway

      - name: Validate Lambda Entrypoints
        run: |
          find backend/functions backend/shared backend/monitors -name '*.mjs' -print0 | xargs -0 -n1 node --check

  infra:
    name: Infra CDK Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Infra Dependencies
        run: npm install
        working-directory: infra

      - name: Typecheck CDK
        run: npm run check
        working-directory: infra

      - name: Validate IAM Policy Artifacts
        run: npm run check:iam
        working-directory: infra

      - name: Check DB Rotation Preflight Baseline
        run: npm run check:db-rotation-preflight
        working-directory: infra

      - name: Check Observability Readiness
        run: npm run check:observability
        working-directory: infra

      - name: Check RDS Network Exposure Baseline
        run: npm run check:rds-network
        working-directory: infra

      - name: Check Secrets Boundary Baseline
        run: npm run check:secrets
        working-directory: infra

      - name: Check Secrets Rotation KMS Baseline
        run: npm run check:secrets-rotation-kms
        working-directory: infra

      - name: Check Tracing Readiness Baseline
        run: npm run check:tracing
        working-directory: infra

      - name: Synthesize CDK Plan
        run: npm run synth
        working-directory: infra

      - name: Synthesize Isolated Evidence Store Plan
        run: npm run synth -- VentusEvidenceStoreStack -c enableEvidenceStoreMigrator=true
        working-directory: infra

      - name: Synthesize AWS Identity Foundation
        run: npx cdk synth VentusIdentityStack -c enableIdentityFoundation=true --quiet
        working-directory: infra

      - name: Synthesize Growth Console API
        run: npx cdk synth VentusConsoleApiStack -c enableConsoleApi=true --quiet
        working-directory: infra

  frontend:
    name: Frontend Build And Lint
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Checked out by branch rather than the PR merge ref so the lockfile sync
      # below has somewhere to push.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Runs before the lockfile sync below, so a rejected dependency set never
      # gets a lockfile committed for it.
      - name: Check Frontend Dependency Changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          node scripts/check-frontend-deps.mjs "origin/${{ github.base_ref }}" \
            "${{ contains(github.event.pull_request.labels.*.name, 'deps-approved') && 'approved' || 'review' }}"

      # Lovable authors with bun, so it edits package.json and leaves
      # package-lock.json behind. `npm ci` refuses to install when the two
      # disagree, and amplify.yml deploys with `npm ci` as well — so an
      # unsynced lockfile breaks production, not just this job.
      - name: Sync package-lock.json
        id: lockfile
        run: |
          npm install --package-lock-only --no-audit --no-fund
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already in sync"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Fork PRs get the fixed lockfile for this run but cannot be pushed to,
      # so the commit is skipped rather than failing the build.
      - name: Commit synced lockfile
        if: >-
          steps.lockfile.outputs.changed == 'true'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package-lock.json with package.json"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Install Dependencies
        run: npm ci

      - name: Lint Advisory
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build
